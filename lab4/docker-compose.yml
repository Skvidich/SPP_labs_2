services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coin_rush
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coin_rush"]
      interval: 3s
      timeout: 3s
      retries: 5

  server:
    build: ./server
    ports: ["5000:5000"]
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/coin_rush
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata: