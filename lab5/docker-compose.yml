version: "3.9"

name: music-catalog

services:
  postgres:
    image: postgres:16-alpine
    container_name: music-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music}
      POSTGRES_DB: ${POSTGRES_DB:-music_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Развёртывание схемы выполняется один раз при инициализации БД
      # (docker-entrypoint-initdb.d выполняется только для пустого каталога данных).
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-music} -d ${POSTGRES_DB:-music_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - music_net

  collector:
    build:
      context: ./collector
      shm_size: "64mb"
    container_name: music-collector
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-music}:${POSTGRES_PASSWORD:-music}@postgres:5432/${POSTGRES_DB:-music_db}
      COLLECTOR_METRICS_PORT: ${COLLECTOR_METRICS_PORT:-9120}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-warn}
    ports:
      - "127.0.0.1:${COLLECTOR_METRICS_PORT:-9120}:${COLLECTOR_METRICS_PORT:-9120}"
    networks:
      - music_net

  catalog-service:
    build:
      context: ./catalog-service
    container_name: music-catalog
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${CATALOG_PORT:-4001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-music}:${POSTGRES_PASSWORD:-music}@postgres:5432/${POSTGRES_DB:-music_db}
      METRICS_PORT: ${CATALOG_METRICS_PORT:-9101}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-warn}
    ports:
      - "127.0.0.1:${CATALOG_PORT:-4001}:${CATALOG_PORT:-4001}"
      - "127.0.0.1:${CATALOG_METRICS_PORT:-9101}:${CATALOG_METRICS_PORT:-9101}"
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - music_net

  collections-service:
    build:
      context: ./collections-service
    container_name: music-collections
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${COLLECTIONS_PORT:-4002}
      DATABASE_URL: postgresql://${POSTGRES_USER:-music}:${POSTGRES_PASSWORD:-music}@postgres:5432/${POSTGRES_DB:-music_db}
      METRICS_PORT: ${COLLECTIONS_METRICS_PORT:-9102}
      CATALOG_URL: http://catalog-service:${CATALOG_PORT:-4001}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-warn}
    ports:
      - "127.0.0.1:${COLLECTIONS_PORT:-4002}:${COLLECTIONS_PORT:-4002}"
      - "127.0.0.1:${COLLECTIONS_METRICS_PORT:-9102}:${COLLECTIONS_METRICS_PORT:-9102}"
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - music_net

  gateway:
    build:
      context: ./gateway
    container_name: music-gateway
    restart: unless-stopped
    depends_on:
      catalog-service:
        condition: service_healthy
      collections-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${GATEWAY_PORT:-4000}
      CATALOG_URL: http://catalog-service:${CATALOG_PORT:-4001}
      COLLECTIONS_URL: http://collections-service:${COLLECTIONS_PORT:-4002}
      METRICS_PORT: ${GATEWAY_METRICS_PORT:-9100}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-warn}
      # Метрики отправляются в Prometheus (эндпоинт /metrics), а не в
      # usage-reporting Apollo. Отключаем встроенный экспорт данных Apollo.
      APOLLO_TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-4000}:${GATEWAY_PORT:-4000}"
      - "127.0.0.1:${GATEWAY_METRICS_PORT:-9100}:${GATEWAY_METRICS_PORT:-9100}"
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - music_net

  frontend:
    build:
      context: ./frontend
    container_name: music-frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      NGINX_ENVSUBST_GATEWAY_PROXY_TARGET: gateway:${GATEWAY_PORT:-4000}
      PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - music_net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: music-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - music_net

  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    container_name: music-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${JAEGER_OTLP_PORT:-4318}:4318"
    networks:
      - music_net

networks:
  music_net:
    driver: bridge

volumes:
  pg_data:
  prom_data: