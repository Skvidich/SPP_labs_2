global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: collector
    static_configs:
      - targets: ["collector:9120"]

  - job_name: catalog-service
    static_configs:
      - targets: ["catalog-service:9101"]

  - job_name: collections-service
    static_configs:
      - targets: ["collections-service:9102"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:9100"]